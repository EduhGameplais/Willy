<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Face</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="avatar-container">
        <div class="thinking-bubble" id="thinkingBubble">? 🤔 ?</div>
        <div class="happy-bubble" id="happyBubble">😊 ✨ 🎉</div>
        <div class="romantic-bubble" id="romanticBubble">💕 💖 💕</div>
        
        <div class="face">
            <div class="eye" id="leftEye"></div>
            <div class="eye" id="rightEye"></div>
        </div>
        
        <div class="mouth" id="mouth">
            <div class="bar idle"></div>
            <div class="bar idle"></div>
            <div class="bar idle"></div>
            <div class="bar idle"></div>
            <div class="bar idle"></div>
        </div>
    </div>

    <!-- Controles de teste (pode remover em produção) -->
    <div class="controls">
        <button class="control-btn" onclick="setState('idle')">Idle</button>
        <button class="control-btn" onclick="setState('thinking')">Pensando</button>
        <button class="control-btn" onclick="setState('speaking')">Falando</button>
        <button class="control-btn" onclick="setState('happy')">Feliz</button>
        <button class="control-btn" onclick="setState('romantic')">Romântico</button>
    </div>

    <div class="status" id="status">Estado: Idle</div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
